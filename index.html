<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 404核心容器 */
        .error-container {
            text-align: center;
            max-width: 800px;
            padding: 50px 30px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .error-container:hover {
            transform: translateY(-5px);
        }

        /* 404数字样式 */
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #2c6ed5;
            margin-bottom: 20px;
            letter-spacing: 10px;
            position: relative;
        }

        /* 辅助装饰效果 */
        .error-code::before,
        .error-code::after {
            content: "";
            display: inline-block;
            width: 60px;
            height: 2px;
            background-color: #2c6ed5;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .error-code::before {
            left: -80px;
        }

        .error-code::after {
            right: -80px;
        }

        /* 错误提示标题 */
        .error-title {
            font-size: 32px;
            color: #222;
            margin-bottom: 15px;
        }

        /* 错误描述文本 */
        .error-desc {
            font-size: 16px;
            color: #777;
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 返回按钮样式 */
        .back-btn {
            display: inline-block;
            padding: 12px 35px;
            background-color: #2c6ed5;
            color: #fff !important;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #1f5bb8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 110, 213, 0.3);
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
                letter-spacing: 5px;
            }

            .error-code::before,
            .error-code::after {
                width: 40px;
                left: -60px;
                right: -60px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-container {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 60px;
            }

            .error-code::before,
            .error-code::after {
                display: none;
            }
        }
    </style>
    <!-- 引入图标库（可选，用于增强视觉效果） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="error-title">哎呀，页面走丢了！</h2>
        <p class="error-desc">
            您访问的页面不存在、已被删除或网址输入错误。<br>
            请检查网址是否正确，或返回首页继续浏览。
        </p>
        <!-- 可将 href 属性修改为你的网站首页地址 -->
        <a href="/" class="back-btn">
            <i class="fas fa-home"></i> 返回首页
        </a>
    </div>
</body>
</html>
